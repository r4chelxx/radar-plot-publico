name: Unified public web intake
on:
  pull_request:
    paths:
      - 'scripts/collect-web-leads.js'
      - 'scripts/import-linkedin-public-posts.js'
      - 'tests/linkedin-public-import.test.js'
      - 'tests/linkedin-unified-e2e.test.js'
      - 'scripts/discover-public-feeds.mjs'
      - 'scripts/discover-dvs-public.mjs'
      - 'scripts/test-web-intake.js'
      - 'scripts/check-public-health.js'
      - 'scripts/check-deployed-revision.js'
      - 'tests/deployed-revision.test.js'
      - 'scripts/test-rls-owner-model.js'
      - '.github/workflows/public-health.yml'
      - 'scripts/unify-discovery.js'
      - 'scripts/quality-gate-discovery.js'
      - 'scripts/sample-editorial-review.js'
      - 'scripts/export-editorial-review.js'
      - 'scripts/merge-editorial-queue.js'
      - 'scripts/check-operational-state.js'
      - 'tests/operational-state.test.js'
      - 'tests/editorial-queue-reconcile.test.js'
      - 'scripts/test-editorial-pipeline.js'
      - 'scripts/publish-approved.js'
      - 'scripts/verify-published-records.js'
      - 'scripts/validate-approved-manifest.js'
      - 'intake/approved-publications.json'
      - '.github/workflows/editorial-publish.yml'
      - 'scripts/report-discovery-operations.js'
      - 'tests/discovery-operations.test.js'
      - 'scripts/summarize-discovery.js'
      - 'data/sources.js'
      - '.github/workflows/unified-web-intake.yml'
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('radar-unified-pr-{0}', github.event.pull_request.number) || 'radar-state-writers' }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check collector JavaScript syntax
        run: |
          node --check scripts/discover-public-feeds.mjs
          node --check scripts/discover-dvs-public.mjs
      - name: Test public LinkedIn import safeguards
        run: node --test tests/linkedin-public-import.test.js
      - name: Test LinkedIn and web cross-source deduplication
        run: node --test tests/linkedin-unified-e2e.test.js
      - name: Test web intake safeguards
        run: node scripts/test-web-intake.js
      - name: Test production deployment revision checks
        run: node --test tests/deployed-revision.test.js
      - name: Test daily discovery source health reporting
        run: node --test tests/discovery-operations.test.js
      - name: Test editorial queue reconciliation
        run: node --test tests/editorial-queue-reconcile.test.js
      - name: Test operational editorial state reconciliation
        run: node --test tests/operational-state.test.js
      - name: Test editorial publication safeguards
        run: |
          node scripts/test-editorial-pipeline.js
          node --check scripts/verify-published-records.js
      - name: Dry-run actual approved editorial manifest without publishing
        run: node scripts/validate-approved-manifest.js
      - name: Validate operational probe syntax
        run: node --check scripts/check-public-health.js
      - name: Test cross-account ownership model
        run: node scripts/test-rls-owner-model.js
      - name: Verify currently deployed public site
        run: node scripts/check-public-health.js
      - name: Discover new public feed entries
        id: feeds
        continue-on-error: true
        run: node scripts/discover-public-feeds.mjs
      - name: Discover public DVS toolkit links
        id: dvs
        continue-on-error: true
        run: node scripts/discover-dvs-public.mjs
      - name: Require at least one live discovery source
        run: |
          if [ "${{ steps.feeds.outcome }}" != "success" ] && [ "${{ steps.dvs.outcome }}" != "success" ]; then
            echo 'All live discovery collectors failed'
            exit 1
          fi
      - name: Convert previously audited web candidates
        run: node scripts/collect-web-leads.js
      - name: Import reviewed public LinkedIn post URLs if provided
        run: |
          if [ -f intake/linkedin-public-posts.json ]; then
            node scripts/import-linkedin-public-posts.js intake/linkedin-public-posts.json intake/linkedin-public-candidates.json
          else
            printf '{"source":"linkedin","leads":[],"coverageStatus":"partial"}\n' > intake/linkedin-public-candidates.json
          fi
      - name: Consolidate live and historical candidates
        run: node scripts/unify-discovery.js intake/live-web-discovery.json intake/dvs-public-discovery.json intake/web-discovery-input.json intake/linkedin-public-candidates.json
      - name: Classify duplicate and navigation candidates
        run: node scripts/quality-gate-discovery.js
      - name: Prepare editorial review sample
        run: node scripts/sample-editorial-review.js
      - name: Export readable editorial review
        run: node scripts/export-editorial-review.js
      - name: Summarize collector reliability
        run: node scripts/report-discovery-operations.js
      - name: Show source failures in workflow summary
        run: node scripts/summarize-discovery.js
      - name: Persist candidates on radar-state branch
        if: github.event_name != 'pull_request'
        run: |
          cp intake/discovery-quality.json /tmp/radar-discovery-quality.json
          cp scripts/merge-editorial-queue.js /tmp/radar-merge-editorial-queue.js
          cp scripts/lead-identity.js /tmp/lead-identity.js
          cp intake/historical-decisions.json /tmp/radar-historical-decisions.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin radar-state >/dev/null; then
            git fetch origin radar-state
            git switch -c radar-state --track origin/radar-state
          else
            git switch -c radar-state
          fi
          node /tmp/radar-merge-editorial-queue.js /tmp/radar-discovery-quality.json intake/editorial-queue.json state/lead-history.json /tmp/radar-historical-decisions.json
          git add intake/editorial-queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Editorial: persist pending public candidates [skip ci]"
            git push origin radar-state
          fi
          git switch -
      - name: Upload non-publishing discovery queue
        uses: actions/upload-artifact@v4
        with:
          name: radar-unified-web-intake
          path: |
            intake/live-web-discovery.json
            intake/live-web-health.json
            intake/dvs-public-discovery.json
            intake/dvs-public-health.json
            intake/web-discovery-input.json
            intake/linkedin-public-candidates.json
            intake/unified-discovery.json
            intake/discovery-quality.json
            intake/discovery-operations.json
            intake/editorial-review-sample.json
            intake/editorial-review.md
