name: Unified public web intake
on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"
permissions:
  contents: read
jobs:
  collect-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test web intake safeguards
        run: node scripts/test-web-intake.js
      - name: Discover new public feed entries
        run: node scripts/discover-public-feeds.mjs
      - name: Convert previously audited web candidates
        run: node scripts/collect-web-leads.js
      - name: Consolidate live and historical candidates
        run: node scripts/unify-discovery.js intake/live-web-discovery.json intake/web-discovery-input.json
      - name: Upload non-publishing discovery queue
        uses: actions/upload-artifact@v4
        with:
          name: radar-unified-web-intake
          path: |
            intake/live-web-discovery.json
            intake/live-web-health.json
            intake/web-discovery-input.json
            intake/unified-discovery.json
