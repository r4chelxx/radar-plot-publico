name: Audit Radar links
on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"
  pull_request:
    paths:
      - "data/opportunities.js"
      - "data/datasets.js"
      - "data/sources.js"
      - "data/tools.js"
      - "scripts/check-links.js"
      - "scripts/link-audit-policy.js"
      - "tests/link-audit-policy.test.js"
      - "scripts/collect-catalog-links.js"
      - "tests/catalog-link-extraction.test.js"
      - "scripts/validate-arcgis-rest.js"
      - "tests/arcgis-rest.test.js"
      - ".github/workflows/audit-links.yml"
  push:
    branches: [main]
    paths:
      - "data/opportunities.js"
      - "data/datasets.js"
      - "data/sources.js"
      - "data/tools.js"
      - "scripts/check-links.js"
      - "scripts/link-audit-policy.js"
      - "tests/link-audit-policy.test.js"
      - "scripts/collect-catalog-links.js"
      - "tests/catalog-link-extraction.test.js"
      - ".github/workflows/audit-links.yml"
concurrency:
  group: radar-link-audit-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: write
jobs:
  audit-links:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test ArcGIS JSON service validation
        run: node --test tests/arcgis-rest.test.js tests/catalog-link-extraction.test.js tests/link-audit-policy.test.js
      - name: Audit URLs
        id: audit
        continue-on-error: true
        run: node scripts/check-links.js
      - name: Publish latest audit report
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p audit
          cp link-audit.json audit/link-audit-latest.json
          report_tmp=$(mktemp)
          cp audit/link-audit-latest.json "$report_tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$report_tmp" audit/link-audit-latest.json
            git add audit/link-audit-latest.json
            if git diff --cached --quiet; then
              pushed=true
              break
            fi
            git commit -m "Audit: refresh link report [skip ci]"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            git reset --hard origin/main
            sleep 2
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::Could not persist the completed link-audit report after three attempts"
            exit 1
          fi
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-link-audit
          path: link-audit.json
          if-no-files-found: error
      - name: Fail on persistently broken links
        if: steps.audit.outcome == 'failure'
        run: exit 1
