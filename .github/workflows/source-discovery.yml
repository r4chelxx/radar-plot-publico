# Global opportunity intake is audited by the daily source sweep
name: Radar source discovery
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/sources.js'
      - 'scripts/source-intake.js'
      - 'scripts/publish-approved.js'
      - 'scripts/source-page-links.js'
      - 'tests/source-page-links.test.js'
      - 'scripts/structured-lead-metadata.js'
      - 'tests/structured-lead-metadata.test.js'
      - 'scripts/select-source-sweep.js'
      - 'scripts/check-source-alternatives.js'
      - 'scripts/normalize-lead-link.js'
      - 'tests/normalize-lead-link.test.js'
      - 'scripts/load-source-catalog.js'
      - 'tests/source-catalog.test.js'
      - 'tests/source-intake-coverage.test.js'
      - 'scripts/triage-candidates.js'
      - 'scripts/update-lead-history.js'
      - 'scripts/lead-identity.js'
      - 'tests/lead-privacy.test.js'
      - 'scripts/order-lead-inspection.js'
      - 'tests/inspection-order.test.js'
      - 'scripts/prioritize-editorial-review.js'
      - 'tests/editorial-priority.test.js'
      - 'scripts/write-run-summary.js'
      - 'scripts/backlog-health.js'
      - 'scripts/audit-capacity.js'
      - 'tests/audit-capacity.test.js'
      - 'tests/backlog-health.test.js'
      - 'tests/lead-history.test.js'
      - 'tests/editorial-review.test.js'
      - 'scripts/build-editorial-review.js'
      - 'scripts/inspect-lead-pages.js'
      - 'scripts/inspection-health.js'
      - 'scripts/require-inspection-health.js'
      - 'tests/inspection-health.test.js'
      - 'tests/require-inspection-health.test.js'
      - 'scripts/select-historical-backlog.js'
      - 'scripts/import-public-editorial-queue.js'
      - 'tests/import-public-editorial-queue.test.js'
      - 'scripts/apply-editorial-decisions.js'
      - 'scripts/auto-audit-candidates.js'
      - 'tests/auto-audit-candidates.test.js'
      - 'scripts/validate-approved-manifest.js'
      - 'scripts/merge-approved-manifests.js'
      - 'tests/apply-editorial-decisions.test.js'
      - 'tests/merge-approved-manifests.test.js'
      - 'scripts/build-historical-review-batch.js'
      - 'tests/historical-editorial-batch.test.js'
      - 'intake/historical-decisions.json'
      - 'tests/historical-backlog.test.js'
      - '.github/workflows/source-discovery.yml'
  pull_request:
    paths:
      - 'data/sources.js'
      - 'scripts/check-source-alternatives.js'
      - 'scripts/source-intake.js'
      - 'scripts/source-page-links.js'
      - 'tests/source-page-links.test.js'
      - 'scripts/structured-lead-metadata.js'
      - 'tests/structured-lead-metadata.test.js'
      - 'scripts/select-source-sweep.js'
      - 'scripts/normalize-lead-link.js'
      - 'tests/normalize-lead-link.test.js'
      - 'scripts/triage-candidates.js'
      - 'scripts/build-editorial-review.js'
      - 'scripts/inspect-lead-pages.js'
      - 'scripts/inspection-health.js'
      - 'scripts/require-inspection-health.js'
      - 'tests/inspection-health.test.js'
      - 'tests/require-inspection-health.test.js'
      - 'scripts/import-public-editorial-queue.js'
      - 'tests/import-public-editorial-queue.test.js'
      - 'tests/lead-privacy.test.js'
      - 'tests/source-catalog.test.js'
      - 'tests/source-intake-coverage.test.js'
      - 'tests/inspection-order.test.js'
      - 'scripts/update-lead-history.js'
      - 'scripts/lead-identity.js'
      - 'scripts/prioritize-editorial-review.js'
      - 'tests/editorial-priority.test.js'
      - 'tests/editorial-review.test.js'
      - 'scripts/write-run-summary.js'
      - 'tests/lead-history.test.js'
      - 'scripts/select-historical-backlog.js'
      - 'scripts/apply-editorial-decisions.js'
      - 'scripts/validate-approved-manifest.js'
      - 'tests/apply-editorial-decisions.test.js'
      - 'intake/historical-decisions.json'
      - 'tests/historical-backlog.test.js'
      - '.github/workflows/source-discovery.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('radar-source-pr-{0}', github.event.pull_request.number) || 'radar-state-writers' }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source collector syntax and daily coverage
        run: node --test tests/source-intake-coverage.test.js tests/structured-lead-metadata.test.js tests/source-page-links.test.js
      - name: Test persistent lead history
        run: node --test tests/inspection-health.test.js tests/require-inspection-health.test.js tests/auto-audit-candidates.test.js tests/apply-editorial-decisions.test.js tests/audit-capacity.test.js tests/backlog-health.test.js tests/historical-backlog.test.js tests/historical-editorial-batch.test.js tests/lead-history.test.js tests/source-catalog.test.js tests/editorial-review.test.js tests/editorial-priority.test.js tests/inspection-order.test.js tests/lead-privacy.test.js tests/normalize-lead-link.test.js
      - name: Test public queue integration
        run: node --test tests/import-public-editorial-queue.test.js
      - name: Inspect monitored source websites
        run: node scripts/source-intake.js
      - name: Diagnose official alternative URLs (non-mutating)
        run: node scripts/check-source-alternatives.js
      - name: Compare extracted titles against catalog entries
        run: node scripts/triage-candidates.js
      - name: Restore public lead history
        run: |
          set -euo pipefail
          git fetch --no-tags origin radar-state
          git show FETCH_HEAD:state/lead-history.json > intake/lead-history-previous.json
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('intake/lead-history-previous.json'));if(s.schemaVersion!==1||!s.leads||Array.isArray(s.leads))process.exit(1)"
          echo "Restored persisted lead history from radar-state."

      - name: Restore public unified discovery candidates
        run: |
          set -euo pipefail
          git fetch --no-tags origin radar-state
          git show FETCH_HEAD:intake/editorial-queue.json > intake/editorial-queue-public.json
          node -e "const q=require('./intake/editorial-queue-public.json');if(q.schemaVersion!==1||!Array.isArray(q.candidates))process.exit(1)"
          echo "Restored persisted editorial queue from radar-state."

      - name: Merge DVS and public web candidates into daily historical backlog
        run: node scripts/import-public-editorial-queue.js
      - name: Inspect historical backlog in rotating batches
        env:
          LEAD_PAGE_LIMIT: '100'
        run: node scripts/inspect-lead-pages.js
      - name: Require technical inspection coverage
        run: node scripts/require-inspection-health.js intake/lead-evidence.json
      - name: Build editorial review queue
        run: node scripts/build-editorial-review.js
      - name: Compare against persistent public lead history
        run: node scripts/update-lead-history.js
      - name: Generate conservative automatic editorial decisions
        run: node scripts/auto-audit-candidates.js intake/lead-evidence.json intake/editorial-review.json intake/auto-editorial-decisions.json
      - name: Merge automatic decisions without changing manual decisions
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const manual=JSON.parse(fs.readFileSync('intake/historical-decisions.json','utf8'));
          const automatic=JSON.parse(fs.readFileSync('intake/auto-editorial-decisions.json','utf8'));
          const seen=new Set((manual.decisions||[]).map(x=>x.url));
          const merged={...manual,decisions:[...(manual.decisions||[]),...(automatic.decisions||[]).filter(x=>!seen.has(x.url))]};
          fs.writeFileSync('intake/historical-decisions-merged.json',JSON.stringify(merged,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Auditoria automática conservadora\n- Aprovações geradas: '+automatic.decisions.length+'\n- Bloqueios mantidos em revisão: '+automatic.summary.blocked+'\n');
          NODE
      - name: Apply verified editorial decisions to historical state
        env:
          RADAR_DECISIONS: intake/historical-decisions-merged.json
        run: node scripts/apply-editorial-decisions.js
      - name: Build actionable historical editorial review batch
        env:
          EDITORIAL_BATCH_LIMIT: '60'
        run: node scripts/build-historical-review-batch.js
      - name: Prioritize editorial review from historical changes
        run: node scripts/prioritize-editorial-review.js
      - name: Publish run summary in GitHub Actions
        run: node scripts/write-run-summary.js
      - uses: actions/upload-artifact@v4
        with:
          name: source-intake-${{ github.run_id }}
          path: |
            intake/source-review.json
            intake/alternative-access.json
            intake/candidate-triage.json
            intake/lead-evidence.json
            intake/editorial-queue-public.json
            intake/editorial-review.json
            intake/historical-editorial-batch.json
            intake/historical-editorial-batch.md
            intake/lead-history-delta.json
            intake/lead-history-next.json
            intake/approved-publications-next.json
            intake/auto-editorial-decisions.json
            intake/historical-decisions-merged.json
            intake/approved-manifest-merge.json
            intake/run-summary.md
          if-no-files-found: error
  persist:
    needs: discover
    env:
      GH_REPO: ${{ github.repository }}
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-intake-${{ github.run_id }}
          path: intake
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote explicit audited approvals to the public manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f intake/approved-publications-next.json ]; then
            echo "No generated approval manifest; leaving public manifest unchanged."
            exit 0
          fi
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('intake/approved-publications-next.json'));if(!Array.isArray(m.approved))throw Error('Generated approval manifest is invalid');for(const x of m.approved){if(x.review?.decision!=='approved'||!x.review?.officialUrl||!x.review?.evidence||!x.record?.id)throw Error('Generated approval lacks explicit evidence: '+(x.record?.id||'?'));}"
          RADAR_APPROVED_MANIFEST=intake/approved-publications-next.json node scripts/validate-approved-manifest.js
          for attempt in 1 2 3; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/intake/approved-publications.json?ref=main" > intake/approved-manifest-response.json
            node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('intake/approved-manifest-response.json','utf8'));
          fs.writeFileSync('intake/approved-publications-current.json',Buffer.from(r.content,'base64'));
          NODE
          node scripts/merge-approved-manifests.js intake/approved-publications-current.json intake/approved-publications-next.json intake/approved-publications-merged.json > intake/approved-manifest-merge.json
          RADAR_APPROVED_MANIFEST=intake/approved-publications-merged.json node scripts/validate-approved-manifest.js
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('intake/approved-manifest-merge.json','utf8'));
          const newApprovals=Math.max(0,r.merged-r.current);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,['### Ponte auditoria → publicação','- Aprovações no manifesto atual: '+r.current,'- Registros reapresentados pela auditoria (não são novos): '+r.incoming,'- Novas aprovações incorporadas nesta rodada: '+newApprovals,'- Aprovações após merge: '+r.merged].join('\n')+'\n');
          NODE
            if node -e "const fs=require('fs');const a=JSON.stringify(JSON.parse(fs.readFileSync('intake/approved-publications-merged.json')));const b=JSON.stringify(JSON.parse(fs.readFileSync('intake/approved-publications-current.json')));process.exit(a===b?0:1)"; then
              echo "Public approval manifest is already current."
              echo "### Resultado de publicação: nenhuma publicação nova" >> "$GITHUB_STEP_SUMMARY"
              echo "O manifesto permaneceu inalterado; esta rodada não publicou novos registros no site." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('intake/approved-manifest-response.json','utf8'));
          const content=fs.readFileSync('intake/approved-publications-merged.json').toString('base64');
          fs.writeFileSync('intake/approved-manifest-update.json',JSON.stringify({branch:'main',message:'Promote explicitly audited publication approvals from source run '+process.env.GITHUB_RUN_ID,content,sha:r.sha}));
          NODE
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/intake/approved-publications.json" --input intake/approved-manifest-update.json --silent; then
              echo "### Manifesto de aprovações auditadas atualizado" >> "$GITHUB_STEP_SUMMARY"
              echo "O manifesto público recebeu somente decisões com ficha completa, evidência oficial e aprovação explícita." >> "$GITHUB_STEP_SUMMARY"
              if gh workflow run editorial-publish.yml --ref main; then
                echo "### Publicador editorial disparado explicitamente" >> "$GITHUB_STEP_SUMMARY"
                echo "A atualização do manifesto foi encaminhada ao workflow de publicação, sem depender de um novo evento push." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::Manifesto atualizado, mas não foi possível disparar o publicador editorial"
                exit 1
              fi
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "::error::Could not promote audited approval manifest after three attempts"
          exit 1

      - name: Validate generated public history before persistence
        run: |
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('intake/lead-history-next.json'));if(s.schemaVersion!==1||!s.updatedAt||!s.leads||Array.isArray(s.leads))process.exit(1);console.log('Validated lead history:',Object.keys(s.leads).length)"
      - name: Persist public history with write-scoped token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/lead-history.json?ref=radar-state" --jq .sha)
            SHA="$sha" node -e "const fs=require('fs');const body={branch:'radar-state',message:'Update public lead history from run '+process.env.GITHUB_RUN_ID,content:fs.readFileSync('intake/lead-history-next.json').toString('base64'),sha:process.env.SHA};fs.writeFileSync('intake/lead-history-update.json',JSON.stringify(body))"
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/state/lead-history.json" --input intake/lead-history-update.json --silent; then
              echo "Public lead history saved on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::Failed to persist lead history after three attempts"
          exit 1
      - name: Verify remote state matches uploaded history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            blob_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/lead-history.json?ref=radar-state" --jq .sha 2>/dev/null || true)
            encoded=$(if [ -n "$blob_sha" ]; then gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$blob_sha" --jq .content 2>/dev/null || true; fi)
            if [ -n "$encoded" ]; then
              printf '%s' "$encoded" | base64 --decode > intake/lead-history-confirmed.json
              if [ -s intake/lead-history-confirmed.json ]; then
                break
              fi
            fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          if [ ! -s intake/lead-history-confirmed.json ]; then
            echo "::error::Persisted lead history could not be read back after five attempts"
            exit 1
          fi
          cmp intake/lead-history-next.json intake/lead-history-confirmed.json
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('intake/lead-history-confirmed.json'));if(s.schemaVersion!==1||!s.updatedAt||!s.leads||Array.isArray(s.leads))process.exit(1);console.log('Confirmed persisted leads:',Object.keys(s.leads).length)"
          echo "### Persistência do Radar confirmada" >> "$GITHUB_STEP_SUMMARY"
          echo "O conteúdo salvo na branch radar-state corresponde exatamente ao histórico gerado nesta execução." >> "$GITHUB_STEP_SUMMARY"
      - name: Reconcile and persist the public editorial queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            # Contents API omits file content above its size limit; keep only its SHA for the update.
            gh api "repos/${GITHUB_REPOSITORY}/contents/intake/editorial-queue.json?ref=radar-state" > intake/queue-response.json
            git fetch --no-tags origin radar-state
            git show FETCH_HEAD:intake/editorial-queue.json > intake/queue-reconciled.json
            # The queue can change after the previous history confirmation; re-read history from the remote.
            blob_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/lead-history.json?ref=radar-state" --jq .sha)
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$blob_sha" --jq .content | base64 --decode > intake/lead-history-queue-check.json
            node - <<'NODE'
          const fs=require('node:fs');
          const response=JSON.parse(fs.readFileSync('intake/queue-response.json','utf8'));
          if(!response.sha)throw Error('Missing editorial queue blob SHA');
          fs.writeFileSync('intake/queue-empty-review.json',JSON.stringify({review:[]}));
          NODE
            node scripts/merge-editorial-queue.js intake/queue-empty-review.json intake/queue-reconciled.json intake/lead-history-queue-check.json intake/historical-decisions.json
            if ! node scripts/check-operational-state.js intake/queue-reconciled.json intake/lead-history-queue-check.json intake/historical-decisions.json; then
              echo "::warning::Queue/history snapshot inconsistent on attempt $attempt; refreshing both before retry" >&2
              if [ "$attempt" -lt 3 ]; then sleep 10; continue; fi
              echo "::error::Persisted editorial state remained inconsistent after three snapshots" >&2
              exit 1
            fi
            node - <<'NODE'
          const fs=require('node:fs');
          const response=JSON.parse(fs.readFileSync('intake/queue-response.json','utf8'));
          fs.writeFileSync('intake/queue-update.json',JSON.stringify({branch:'radar-state',message:'Reconcile public queue after source run '+process.env.GITHUB_RUN_ID,sha:response.sha,content:fs.readFileSync('intake/queue-reconciled.json').toString('base64')}));
          NODE
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/intake/editorial-queue.json" --input intake/queue-update.json --silent; then
              git fetch --no-tags origin radar-state
              git show FETCH_HEAD:intake/editorial-queue.json > intake/queue-confirmed.json
              cmp intake/queue-reconciled.json intake/queue-confirmed.json
              node scripts/check-operational-state.js intake/queue-confirmed.json intake/lead-history-queue-check.json intake/historical-decisions.json
              echo "### Fila editorial sincronizada com o histórico persistente" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::Failed to persist reconciled public queue" >&2
          exit 1
      - name: Link report in daily editorial queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(TZ=America/Bahia date +%F)
          title="Radar editorial: $day"
          issue=$(gh issue list --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          report="Lote histórico de 15 candidatos e evidências (historical-editorial-batch.json/.md): https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Revisar fontes oficiais, prazos, elegibilidade e duplicidades. Registrar decisões no manifesto; não publicar pistas não verificadas."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$report"
          else
            gh issue create --title "$title" --body "$report"
          fi
