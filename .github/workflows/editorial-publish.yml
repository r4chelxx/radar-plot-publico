# Publication status semantics validated by test-editorial-pipeline
name: Publish approved editorial records
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/editorial-publish.yml'
      - 'scripts/check-daily-publication-target.js'
      - 'tests/daily-publication-target.test.js'
      - 'scripts/publish-approved.js'
      - 'scripts/build-automated-publications.js'
      - 'tests/automated-publication.test.js'
      - 'scripts/test-editorial-pipeline.js'
      - 'data/datasets.js'
      - 'data/tools.js'
      - 'data/opportunities.js'
      - 'data/changelog.js'
      - 'intake/approved-publications.json'
  push:
    branches: [main]
    paths:
      - 'intake/approved-publications.json'
      - 'scripts/build-automated-publications.js'
      - 'scripts/publish-approved.js'
      - 'tests/automated-publication.test.js'
      - '.github/workflows/editorial-publish.yml'
      - 'scripts/check-daily-publication-target.js'
      - 'tests/daily-publication-target.test.js'
  workflow_run:
    workflows: ["Unified public web intake"]
    types: [completed]
    branches: [main]
  schedule:
    # Retry publication after later intake windows; approved-only and no-change safe.
    - cron: "0 14 * * *"
    - cron: "31 12 * * *"
    - cron: "11 17 * * *"
    - cron: "41 23 * * *"
concurrency:
  group: radar-editorial-publish
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test editorial publication safeguards
        run: node scripts/test-editorial-pipeline.js
      - name: Test deterministic automated publication gate
        run: node --test tests/automated-publication.test.js
      - name: Test cumulative daily publication target
        run: node --test tests/daily-publication-target.test.js
      - name: Prepare combined approved manifest from fresh evidence drafts
        shell: bash
        run: |
          set -euo pipefail
          draft_file=/tmp/radar-publication-drafts.json
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '{"schemaVersion":1,"drafts":[]}' > "$draft_file"
          else
            git fetch --depth=1 origin radar-state
            git show FETCH_HEAD:intake/editorial-queue.json > /tmp/radar-editorial-queue.json
            git show FETCH_HEAD:intake/editorial-evidence-review.json > /tmp/radar-editorial-evidence-review.json
            node scripts/build-editorial-record-drafts.js /tmp/radar-editorial-queue.json /tmp/radar-editorial-evidence-review.json "$draft_file"
          fi
          node scripts/build-automated-publications.js "$draft_file" intake/approved-publications.json /tmp/radar-combined-approved.json
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('/tmp/radar-combined-approved.json','utf8'));
          const automatic=manifest.approved.filter(x=>x.review?.reviewPolicyVersion==='radar-evidence-v1');
          const byCategory=Object.fromEntries(['opportunities','datasets','tools'].map(c=>[c,automatic.filter(x=>x.category===c).length]));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,['### Aprovações automáticas por evidência',...Object.entries(byCategory).map(([c,n])=>'- '+c+': '+n),'- Total: '+automatic.length,'Somente fichas completas, recentes e com verificações específicas passam pelo gate.'].join('\n')+'\n');
          NODE
      - name: Dry-run combined approved manifest without publishing
        env:
          RADAR_APPROVED_MANIFEST: /tmp/radar-combined-approved.json
        run: node scripts/validate-approved-manifest.js
      - name: Build catalog additions from human and evidence-gated approvals
        run: node scripts/publish-approved.js /tmp/radar-combined-approved.json
      - name: Detect whether any approved records are new
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/opportunities.js data/datasets.js data/tools.js data/changelog.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh cache keys for updated public catalogs
        if: steps.changes.outputs.changed == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let html=fs.readFileSync('index.html','utf8');
          for(const part of ['opportunities','datasets','tools','changelog']){
            const rx=new RegExp('data/'+part+'[.]js[?]v=[^" ]+','g');
            html=html.replace(rx,'data/'+part+'.js?v=editorial-'+process.env.RUN_ID);
          }
          fs.writeFileSync('index.html',html);
          NODE
      - name: Validate editorial data
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/validate-data.js
      - name: Test static UI
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/test-ui-static.js
      - name: Test discovery safeguards
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/test-web-intake.js
      - name: Install browser test dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile
        if: steps.changes.outputs.changed == 'true'
        run: npx playwright test
      - name: Audit new editorial record URLs before publication
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/check-new-editorial-links.js
      - name: Report actual new records by category
        id: category-counts
        if: steps.changes.outputs.changed == 'true'
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          const categories=['opportunities','tools','datasets'];
          function load(source,key){
            const ctx={window:{RADAR_PARTS:{}}};
            vm.createContext(ctx);
            vm.runInContext(source,ctx);
            return ctx.window.RADAR_PARTS[key]||[];
          }
          const lines=[];
          let shortfall=false;
          for(const key of categories){
            const path='data/'+key+'.js';
            const before=load(cp.execFileSync('git',['show','HEAD:'+path],{encoding:'utf8'}),key);
            const after=load(fs.readFileSync(path,'utf8'),key);
            const known=new Set(before.map(x=>String(x.id)));
            const added=after.filter(x=>!known.has(String(x.id)));
            lines.push('- '+key+': '+added.length+' novo(s)');
            if(added.length<2){shortfall=true;lines.push('  - ALERTA: menos de 2 novos registros nesta execução.');}
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Publicações novas por categoria\\n'+lines.join('\\n')+'\\n');
          console.log(lines.join('\\n'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'shortfall='+shortfall+'\n');
          NODE
      - name: Create and merge verified editorial PR
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RADAR_DIRECT_PUBLISH_FALLBACK: 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch="radar-approved-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/opportunities.js data/datasets.js data/tools.js data/changelog.js index.html
          git commit -m "Editorial: publish verified records"
          git push origin "$branch"
          if pr_url=$(gh pr create --base main --head "$branch" --title "Radar editorial: approved publications ${{ github.run_id }}" --body "Only entries accepted by the combined approval manifest or status updates for existing expired opportunities. Validation, static UI, web-intake regression, Playwright browser tests and link audit passed in this publishing workflow. No unverified leads are promoted."); then
            echo "Created $pr_url"
            gh pr merge "$pr_url" --squash --delete-branch
            echo "Editorial PR merged: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RADAR_DIRECT_PUBLISH_FALLBACK" = 'true' ]; then
            echo "::warning::GitHub Actions could not create the editorial PR; all publication safeguards passed, so committing the validated catalog directly to main."
            git push origin "HEAD:main"
            echo "### Publicação direta de contingência executada" >> "$GITHUB_STEP_SUMMARY"
            echo "A criação do PR foi recusada pelo repositório; dados, UI, Playwright e links já tinham passado antes do commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not create editorial PR and direct fallback is disabled"
            exit 1
          fi

      - name: Report no new approved publications
        if: steps.changes.outputs.changed != 'true'
        run: |
          echo "No new approved records were available in this publication window. The daily target is evaluated cumulatively at the final local window." >> "$GITHUB_STEP_SUMMARY"

      - name: Detect final Bahia window for push fallback
        id: final-window
        if: github.event_name == 'push'
        shell: bash
        run: |
          local_time=$(TZ=America/Bahia date +%H%M)
          if [ "$local_time" -ge 2041 ]; then
            echo "final=true" >> "$GITHUB_OUTPUT"
          else
            echo "final=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate cumulative daily publication target
        id: daily-target
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          RADAR_DAILY_MINIMUM: "2"
        run: node scripts/check-daily-publication-target.js

      - name: Open or update daily shortfall issue
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '41 23 * * *') || (github.event_name == 'push' && steps.final-window.outputs.final == 'true')) && steps.daily-target.outputs.target_met != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Radar 1.0: fila aprovada esgotada — publicações diárias pendentes"
          issue_number=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Radar 1.0: fila aprovada esgotada — publicações diárias pendentes") | .number' | head -n 1)
          body="Meta diária cumulativa não atingida em ${{ steps.daily-target.outputs.date }} (horário de Salvador). Contagem: ${{ steps.daily-target.outputs.counts }}. Meta: pelo menos 2 oportunidades, 2 ferramentas e 2 bases publicadas hoje com evidência verificada. Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Close resolved daily shortfall issue
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '41 23 * * *') || (github.event_name == 'push' && steps.final-window.outputs.final == 'true')) && steps.daily-target.outputs.target_met == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Radar 1.0: fila aprovada esgotada — publicações diárias pendentes"
          issue_number=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Radar 1.0: fila aprovada esgotada — publicações diárias pendentes") | .number' | head -n 1)
          if [ -n "$issue_number" ]; then gh issue close "$issue_number" --comment "Meta diária cumulativa atingida em ${{ steps.daily-target.outputs.date }} (Salvador). Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi

      - name: Verify approved records on deployed public site
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        env:
          RADAR_APPROVED_MANIFEST: /tmp/radar-combined-approved.json
          RADAR_DEPLOY_RETRIES: "10"
          RADAR_DEPLOY_DELAY_MS: "15000"
        run: node scripts/verify-published-records.js

      - name: Report final daily shortfall without blocking the radar
        if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '41 23 * * *') || (github.event_name == 'push' && steps.final-window.outputs.final == 'true')) && steps.daily-target.outputs.target_met != 'true'
        run: |
          echo "::warning::Cumulative daily target was not met; verified publication remains pending for the next intake window."
          echo "PUBLICATION_SHORTFALL: cumulative daily target of two verified records per category was not met in the final Salvador window. The queue, source health and shortfall issue remain available for the next automated run." >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize editorial run outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          {
            echo "### Radar PLOT 1.0 — publicação editorial"
            echo "- Resultado do job: ${JOB_STATUS}"
            echo "- Alterações detectadas: ${CHANGED:-não determinado}"
            echo "- Execução: ${RUN_URL}"
            if [ "$JOB_STATUS" != "success" ]; then
              echo "- Ação necessária: consultar a primeira etapa com falha; não presumir publicação."
            elif [ "$CHANGED" = "true" ]; then
              echo "- Ação: PR integrado e verificação pública executada nesta rodada."
            else
              echo "- Resultado editorial: ZERO publicações novas nesta rodada. Não equivale a cumprimento da meta diária; investigar a fila de aprovação."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
