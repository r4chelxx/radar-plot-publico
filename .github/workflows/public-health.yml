name: Public Radar operational health
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data.js'
      - 'data/*.js'
      - 'app.js'
      - 'styles.css'
      - 'scripts/check-public-health.js'
      - 'scripts/check-deployed-revision.js'
      - 'tests/deployed-revision.test.js'
      - 'scripts/check-operational-state.js'
      - 'scripts/verify-published-records.js'
      - 'intake/approved-publications.json'
      - '.github/workflows/public-health.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'data.js'
      - 'data/*.js'
      - 'app.js'
      - 'styles.css'
      - 'tests/public-health.test.js'
      - 'scripts/check-public-health.js'
      - 'scripts/check-operational-state.js'
      - 'tests/operational-state.test.js'
      - 'scripts/verify-published-records.js'
      - 'intake/approved-publications.json'
      - '.github/workflows/public-health.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *'
permissions:
  contents: read
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public health failure detection
        run: node --test tests/public-health.test.js
      - name: Test daily editorial state consistency
        run: node --test tests/operational-state.test.js
      - name: Test deployed revision detection
        run: node --test tests/deployed-revision.test.js
      - name: Check deployed public site and assets
        run: node scripts/check-public-health.js
      - name: Confirm deployed assets match main after propagation
        if: github.event_name != 'pull_request'
        env:
          RADAR_DEPLOY_RETRIES: '12'
          RADAR_DEPLOY_DELAY_MS: '10000'
        run: node scripts/check-deployed-revision.js
      - name: Verify approved catalog records actually reached public deployment
        env:
          RADAR_DEPLOY_RETRIES: '2'
          RADAR_DEPLOY_DELAY_MS: '1000'
        run: node scripts/verify-published-records.js
      - name: Download latest persisted public discovery state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/radar-operational
          gh api "repos/${GITHUB_REPOSITORY}/contents/intake/editorial-queue.json?ref=radar-state" --jq .content | base64 --decode > /tmp/radar-operational/queue.json
          gh api "repos/${GITHUB_REPOSITORY}/contents/state/lead-history.json?ref=radar-state" --jq .content | base64 --decode > /tmp/radar-operational/history.json
      - name: Confirm reviewed leads are not reopened in daily queue
        run: node scripts/check-operational-state.js /tmp/radar-operational/queue.json /tmp/radar-operational/history.json intake/historical-decisions.json
      - name: Record health result
        if: always()
        run: echo "Public Radar health check result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
