name: Public Radar operational health
on:
  pull_request:
    paths:
      - 'index.html'
      - 'data.js'
      - 'data/*.js'
      - 'app.js'
      - 'styles.css'
      - 'tests/public-health.test.js'
      - 'scripts/check-public-health.js'
      - '.github/workflows/public-health.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *'
permissions:
  contents: read
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public health failure detection
        run: node --test tests/public-health.test.js
      - name: Check deployed public site and assets
        run: node scripts/check-public-health.js
      - name: Record health result
        if: always()
        run: echo "Public Radar health check result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
